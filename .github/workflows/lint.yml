name: Lint

# Shellcheck the action's scripts on every PR and on pushes to main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: lite-actions/git-checkout@v1

      # Shared definition, so a fix lands once rather than five times. The
      # caller still owns the job, so the check is still reported as `lint`
      # and branch protection needs no change.
      - name: ShellCheck scripts
        uses: lite-actions/common-workflows/shell-lint@v1
