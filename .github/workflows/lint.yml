name: Lint

# Shellcheck the action's scripts on every PR and on pushes to main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ShellCheck scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # -x follows sourced files; warning severity ignores info/style noise
          # (e.g. dynamic source paths shellcheck can't resolve statically).
          shellcheck -x --severity=warning scripts/*.sh tests/*.sh

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "SLACK_WEBHOOK_URL secret not set; skipping Slack notification."
            exit 0
          fi
          text=":x: *Lint failed* in \`${GITHUB_REPOSITORY}\` on \`${GITHUB_REF_NAME}\` — commit \`${GITHUB_SHA:0:7}\` (<${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}|run #${GITHUB_RUN_NUMBER}>)"
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "$(jq -n --arg t "$text" '{text: $t}')" \
            "${SLACK_WEBHOOK_URL}"
